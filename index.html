<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClashBase Hub - Professional COC Layouts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-neutral-950 text-slate-100 min-h-screen pb-20 select-none">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-neutral-900/95 backdrop-blur-md border-b border-neutral-800">
    <div class="max-w-md mx-auto px-4 py-2.5 flex justify-between items-center gap-1">
      <div class="flex items-center gap-1.5 cursor-pointer" onclick="resetHome()">
        <i class="fa-solid fa-shield-halved text-amber-500 text-xl"></i>
        <span class="font-extrabold text-lg tracking-wider bg-gradient-to-r from-amber-400 to-amber-600 bg-clip-text text-transparent">ClashBase</span>
      </div>

      <div class="flex items-center gap-1.5">
        <!-- Language Switcher -->
        <button type="button" onclick="toggleLanguage()" class="px-2 py-1 rounded bg-neutral-800 hover:bg-neutral-700 text-xs font-semibold border border-neutral-700 text-slate-300">
          <span id="langBtnText">English</span>
        </button>

        <!-- Sort Select -->
        <select id="sortSelect" onchange="changeSort(this.value)" class="bg-neutral-800 text-amber-400 text-xs font-bold px-2 py-1 rounded-lg border border-neutral-700 focus:outline-none cursor-pointer">
          <option value="NEW">⚡ NEW</option>
          <option value="POPULAR">🔥 POPULAR</option>
          <option value="ALL">📦 ALL</option>
        </select>

        <!-- TH Select Dropdown -->
        <select id="thFilterSelect" onchange="changeTh(this.value)" class="bg-neutral-800 text-amber-400 text-xs font-bold px-2 py-1 rounded-lg border border-neutral-700 focus:outline-none cursor-pointer">
          <option value="ALL">ALL TH</option>
          <option value="TH 18">TH 18</option>
          <option value="TH 17">TH 17</option>
          <option value="TH 16">TH 16</option>
          <option value="TH 15">TH 15</option>
          <option value="TH 14">TH 14</option>
          <option value="TH 13">TH 13</option>
          <option value="TH 12">TH 12</option>
          <option value="TH 11">TH 11</option>
          <option value="TH 10">TH 10</option>
          <option value="TH 9">TH 9</option>
          <option value="TH 8">TH 8</option>
          <option value="TH 7">TH 7</option>
          <option value="TH 6">TH 6</option>
          <option value="TH 5">TH 5</option>
          <option value="TH 4">TH 4</option>
        </select>
      </div>
    </div>

    <!-- Category Tabs -->
    <div class="max-w-md mx-auto px-3 pb-2 pt-1 flex items-center gap-1.5 overflow-x-auto no-scrollbar text-xs font-bold">
      <button type="button" onclick="filterByCategory('ALL', this)" class="cat-pill px-3 py-1 rounded-lg bg-amber-500 text-neutral-950 whitespace-nowrap cursor-pointer">All</button>
      <button type="button" onclick="filterByCategory('WAR', this)" class="cat-pill px-3 py-1 rounded-lg bg-neutral-800 text-slate-300 whitespace-nowrap cursor-pointer">War</button>
      <button type="button" onclick="filterByCategory('CWL', this)" class="cat-pill px-3 py-1 rounded-lg bg-neutral-800 text-slate-300 whitespace-nowrap cursor-pointer">CWL</button>
      <button type="button" onclick="filterByCategory('FARMING', this)" class="cat-pill px-3 py-1 rounded-lg bg-neutral-800 text-slate-300 whitespace-nowrap cursor-pointer">Farming</button>
      <button type="button" onclick="filterByCategory('HYBRID', this)" class="cat-pill px-3 py-1 rounded-lg bg-neutral-800 text-slate-300 whitespace-nowrap cursor-pointer">Hybrid</button>
      <button type="button" onclick="filterByCategory('RANK', this)" class="cat-pill px-3 py-1 rounded-lg bg-neutral-800 text-slate-300 whitespace-nowrap cursor-pointer">Rank</button>
      <button type="button" onclick="filterByCategory('FUNNY', this)" class="cat-pill px-3 py-1 rounded-lg bg-neutral-800 text-slate-300 whitespace-nowrap cursor-pointer">Funny</button>
    </div>
  </header>

  <!-- Banner Ad Slot -->
  <div class="max-w-md mx-auto px-4 mt-2">
    <div class="w-full h-12 bg-neutral-900 border border-dashed border-neutral-800 rounded-xl flex items-center justify-center text-neutral-500 text-xs">
      <span data-i18n="adPlaceholder">[ ကြော်ငြာနေရာ - Banner Ad ]</span>
    </div>
  </div>

  <!-- Feed Container -->
  <main class="max-w-md mx-auto px-3 py-3">
    <div id="basesGrid" class="space-y-4">
      <div class="text-slate-400 text-sm py-12 text-center" data-i18n="loadingText">Loading bases...</div>
    </div>
  </main>

  <!-- Floating Action Button (+ Post Base) -->
  <button type="button" onclick="openModal()" class="fixed bottom-6 right-4 z-40 bg-emerald-500 hover:bg-emerald-600 text-neutral-950 w-14 h-14 rounded-full shadow-2xl flex items-center justify-center text-2xl transition transform active:scale-95 border-2 border-emerald-400/40 cursor-pointer">
    <i class="fa-solid fa-plus font-black"></i>
  </button>

  <!-- Upload Modal -->
  <div id="uploadModal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden z-50">
    <div class="bg-neutral-900 border border-neutral-800 rounded-2xl max-w-md w-full p-5 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-base font-bold" data-i18n="modalTitle">Base အသစ်တင်ရန်</h2>
        <button type="button" onclick="closeModal()" class="text-neutral-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <form onsubmit="handleUpload(event)" class="space-y-3">
        <div>
          <label class="text-xs text-neutral-400 block mb-1" data-i18n="labelTitle">ခေါင်းစဉ်</label>
          <input type="text" id="baseTitle" required placeholder="ဥပမာ - Anti-2 Star CWL Base" class="w-full bg-neutral-950 border border-neutral-800 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-amber-500">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs text-neutral-400 block mb-1" data-i18n="labelTownHall">Town Hall</label>
            <select id="thLevel" class="w-full bg-neutral-950 border border-neutral-800 rounded-lg p-2 text-xs text-white">
              <option value="TH 18">TH 18</option>
              <option value="TH 17">TH 17</option>
              <option value="TH 16">TH 16</option>
              <option value="TH 15">TH 15</option>
              <option value="TH 14">TH 14</option>
              <option value="TH 13">TH 13</option>
              <option value="TH 12">TH 12</option>
              <option value="TH 11">TH 11</option>
              <option value="TH 10">TH 10</option>
              <option value="TH 9">TH 9</option>
              <option value="TH 8">TH 8</option>
              <option value="TH 7">TH 7</option>
              <option value="TH 6">TH 6</option>
              <option value="TH 5">TH 5</option>
              <option value="TH 4">TH 4</option>
            </select>
          </div>
          <div>
            <label class="text-xs text-neutral-400 block mb-1" data-i18n="labelBaseType">အမျိုးအစား</label>
            <select id="baseType" class="w-full bg-neutral-950 border border-neutral-800 rounded-lg p-2 text-xs text-white font-medium">
              <option value="WAR">WAR</option>
              <option value="RANK">RANK</option>
              <option value="CWL">CWL</option>
              <option value="HYBRID">HYBRID</option>
              <option value="FARMING">FARMING</option>
              <option value="FUNNY">FUNNY</option>
            </select>
          </div>
        </div>

        <div>
          <label class="text-xs text-neutral-400 block mb-1" data-i18n="labelLink">COC Layout Link</label>
          <input type="url" id="baseLink" required placeholder="https://link.clashofclans.com/..." class="w-full bg-neutral-950 border border-neutral-800 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-amber-500">
        </div>

        <div>
          <label class="text-xs text-neutral-400 block mb-1" data-i18n="labelImage">Base ဓာတ်ပုံ (Gallery မှ ရွေးပါ)</label>
          <input type="file" id="imageFile" accept="image/*" required class="w-full text-xs text-slate-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-neutral-800 file:text-amber-400 hover:file:bg-neutral-700 cursor-pointer">
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal()" class="px-3 py-1.5 bg-neutral-800 hover:bg-neutral-700 rounded-lg text-xs" data-i18n="cancelBtn">ပိတ်မည်</button>
          <button type="submit" id="submitBtn" class="px-4 py-1.5 bg-amber-500 hover:bg-amber-600 font-bold text-neutral-950 rounded-lg text-xs" data-i18n="submitBtn">တင်မည်</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const PROXY_URL = "https://orange-sun-6c0d.thawzinlatt-tt.workers.dev";
    const API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6c29kcHNoaGloZWxlbW93enZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4MjkwNDQsImV4cCI6MjEwNjQwNTA0NH0.x-gP_4a4rcKAjAhNgtegDlq8XD542Y3ufH54J6FVWlo";

    let allBases = [];
    let currentFilterTh = 'ALL';
    let currentFilterCat = 'ALL';
    let currentSort = 'NEW';
    let currentLang = localStorage.getItem('site_lang') || 'my';

    const translations = {
      my: {
        switchText: "English",
        adPlaceholder: "[ ကြော်ငြာနေရာ - Banner Ad ]",
        loadingText: "ဒေတာဆွဲတင်နေပါသည်...",
        noBasesText: "ရွေးချယ်ထားသော Base မရှိသေးပါ။",
        modalTitle: "Base အသစ်တင်ရန်",
        labelTitle: "ခေါင်းစဉ်",
        labelTownHall: "Town Hall",
        labelBaseType: "အမျိုးအစား",
        labelLink: "COC Layout Link",
        labelImage: "Base ဓာတ်ပုံ (Gallery မှ ရွေးပါ)",
        cancelBtn: "ပိတ်မည်",
        submitBtn: "တင်မည်",
        uploading: "တင်နေပါသည်...",
        copyBtn: "Copy Layout",
        copied: "Copied!",
        errorPrefix: "အမှားဖြစ်သွားပါသည်: ",
        successMsg: "Base အောင်မြင်စွာ တင်ပြီးပါပြီ!",
        placeholderTitle: "ဥပမာ - Anti-2 Star CWL Base"
      },
      en: {
        switchText: "မြန်မာစာ",
        adPlaceholder: "[ Advertisement - Banner Ad ]",
        loadingText: "Loading layouts...",
        noBasesText: "No bases found in this filter.",
        modalTitle: "Share New Base",
        labelTitle: "Base Title",
        labelTownHall: "Town Hall",
        labelBaseType: "Category",
        labelLink: "COC Link",
        labelImage: "Base Screenshot (Gallery)",
        cancelBtn: "Cancel",
        submitBtn: "Publish",
        uploading: "Uploading...",
        copyBtn: "Copy Layout",
        copied: "Copied!",
        errorPrefix: "Error: ",
        successMsg: "Base shared successfully!",
        placeholderTitle: "e.g. Anti-2 Star CWL Base"
      }
    };

    function changeSort(val) {
      currentSort = val;
      renderBases();
    }

    function changeTh(val) {
      currentFilterTh = val;
      renderBases();
    }

    function filterByCategory(cat, btn) {
      currentFilterCat = cat;
      document.querySelectorAll('.cat-pill').forEach(b => {
        b.className = "cat-pill px-3 py-1 rounded-lg bg-neutral-800 text-slate-300 whitespace-nowrap cursor-pointer";
      });
      if (btn) {
        btn.className = "cat-pill px-3 py-1 rounded-lg bg-amber-500 text-neutral-950 whitespace-nowrap cursor-pointer";
      }
      renderBases();
    }

    function resetHome() {
      currentFilterTh = 'ALL';
      document.getElementById('thFilterSelect').value = 'ALL';
      currentSort = 'NEW';
      document.getElementById('sortSelect').value = 'NEW';
      const allBtn = document.querySelector('.cat-pill');
      filterByCategory('ALL', allBtn);
    }

    function formatTime(dateStr) {
      if (!dateStr) return "Just now";
      const d = new Date(dateStr);
      const now = new Date();
      const diffSec = Math.max(0, Math.floor((now - d) / 1000));
      const isMm = currentLang === 'my';

      if (diffSec < 60) return isMm ? "ခုနက" : "Just now";
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return `${diffMin}m ${isMm ? "က" : "ago"}`;
      const diffHr = Math.floor(diffMin / 60);
      if (diffHr < 24) return `${diffHr}h ${isMm ? "က" : "ago"}`;
      const diffDay = Math.floor(diffHr / 24);
      return `${diffDay}d ${isMm ? "က" : "ago"}`;
    }

    function getImageUrl(originalUrl) {
      if (!originalUrl) return 'https://placehold.co/600x400/1e293b/94a3b8?text=COC+Base';
      return originalUrl.replace('https://jzsodpshhihelemowzvn.supabase.co', PROXY_URL);
    }

    function renderBases() {
      const grid = document.getElementById('basesGrid');
      const t = translations[currentLang];

      let filtered = [...allBases];

      // TH Filter
      if (currentFilterTh !== 'ALL') {
        filtered = filtered.filter(b => (b.th_level || '').toString().trim().toUpperCase() === currentFilterTh.trim().toUpperCase());
      }

      // Category Filter
      if (currentFilterCat !== 'ALL') {
        filtered = filtered.filter(b => (b.base_type || '').toString().trim().toUpperCase() === currentFilterCat.trim().toUpperCase());
      }

      // Sort Filter (NEW / POPULAR / ALL)
      if (currentSort === 'NEW') {
        filtered.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
      } else if (currentSort === 'POPULAR') {
        filtered.sort((a, b) => (Number(b.copy_count) || 0) - (Number(a.copy_count) || 0));
      }

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="text-slate-400 text-xs col-span-full py-12 text-center">${t.noBasesText}</div>`;
        return;
      }

      grid.innerHTML = filtered.map(b => `
        <div class="bg-neutral-900 border border-neutral-800 rounded-2xl overflow-hidden shadow-lg flex flex-col">
          <div class="relative bg-neutral-950">
            <img src="${getImageUrl(b.image_url)}" alt="${b.title || 'COC Base'}" class="w-full h-56 object-cover" onerror="this.src='https://placehold.co/600x400/1e293b/94a3b8?text=COC+Base'">
            <div class="absolute top-2.5 left-2.5 flex items-center gap-1.5">
              <span class="bg-amber-500 text-neutral-950 text-[11px] font-black px-2 py-0.5 rounded-md shadow">${b.th_level || 'TH'}</span>
              <span class="bg-neutral-900/90 text-amber-400 border border-neutral-700 text-[10px] font-bold px-2 py-0.5 rounded-md backdrop-blur-sm">${b.base_type || 'WAR'}</span>
            </div>
          </div>

          <div class="p-3">
            <h3 class="font-bold text-sm mb-2.5 line-clamp-1 text-slate-100">${b.title || 'Untitled Base'}</h3>
            <div class="flex items-center justify-between text-neutral-400 text-xs border-t border-neutral-800/80 pt-2.5">
              <div class="flex items-center gap-4">
                <span class="flex items-center gap-1 font-semibold text-slate-300">
                  <i class="fa-regular fa-copy text-amber-400"></i>
                  <span id="count-${b.id}">${b.copy_count || 0}</span>
                </span>
                <span class="flex items-center gap-1 text-[11px]">
                  <i class="fa-regular fa-clock"></i>
                  <span>${formatTime(b.created_at)}</span>
                </span>
              </div>

              <button type="button" onclick="handleCopy('${b.id}', '${b.link}', this)" class="bg-amber-500 hover:bg-amber-600 text-neutral-950 font-bold px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5 transition">
                <i class="fa-solid fa-download"></i> <span>${t.copyBtn}</span>
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function handleCopy(baseId, link, btn) {
      try {
        await navigator.clipboard.writeText(link);
      } catch (e) {
        window.open(link, '_blank');
      }

      fetch(`${PROXY_URL}/rest/v1/rpc/increment_copy`, {
        method: 'POST',
        headers: {
          'apikey': API_KEY,
          'Authorization': `Bearer ${API_KEY}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ base_id: Number(baseId) })
      }).catch(() => {});

      const countSpan = document.getElementById(`count-${baseId}`);
      if (countSpan) countSpan.innerText = parseInt(countSpan.innerText || 0) + 1;

      const originalText = btn.innerHTML;
      btn.innerHTML = `<i class="fa-solid fa-check"></i> ${translations[currentLang].copied}`;
      btn.classList.replace('bg-amber-500', 'bg-emerald-500');
      
      setTimeout(() => {
        btn.innerHTML = originalText;
        btn.classList.replace('bg-emerald-500', 'bg-amber-500');
        if (link) window.open(link, '_blank');
      }, 500);
    }

    async function fetchBases() {
      try {
        const res = await fetch(`${PROXY_URL}/rest/v1/bases?select=*&order=created_at.desc`, {
          headers: {
            'apikey': API_KEY,
            'Authorization': `Bearer ${API_KEY}`
          }
        });
        
        if (!res.ok) {
          throw new Error(`Proxy status error: ${res.status}`);
        }

        const data = await res.json();
        allBases = Array.isArray(data) ? data : [];
        renderBases();
      } catch (err) {
        console.error(err);
        document.getElementById('basesGrid').innerHTML = `
          <div class="text-rose-400 text-xs py-8 px-4 text-center border border-rose-900/50 bg-rose-950/20 rounded-xl">
            ဒေတာရယူရာတွင် အမှားဖြစ်သွားပါသည်: <br>${err.message}
          </div>`;
      }
    }

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('site_lang', lang);
      document.documentElement.lang = lang;

      const t = translations[lang];
      document.getElementById('langBtnText').innerText = t.switchText;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.innerText = t[key];
      });

      document.getElementById('baseTitle').placeholder = t.placeholderTitle;
      renderBases();
    }

    function toggleLanguage() {
      setLanguage(currentLang === 'my' ? 'en' : 'my');
    }

    function openModal() {
      document.getElementById('uploadModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('uploadModal').classList.add('hidden');
    }

      const t = translations[currentLang];
      const btn = document.getElementById('submitBtn');
      btn.innerText = t.uploading;
      btn.disabled = true;

        const file = fileInput.files[0];
        if (!file) throw new Error("ဓာတ်ပုံ ရွေးချယ်ပေးပါ");

        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;

        const uploadRes = await fetch(`${PROXY_URL}/storage/v1/object/base-images/${fileName}`, {
          method: 'POST',
          headers: {
            'apikey': API_KEY,
            'Authorization': `Bearer ${API_KEY}`,
            'Content-Type': file.type || 'image/jpeg'
          },
          body: file
        });

        if (!uploadRes.ok) {
          throw new Error("ဓာတ်ပုံ တင်မရပါ");
        }

        const publicImageUrl = `${PROXY_URL}/storage/v1/object/public/base-images/${fileName}`;

        const title = document.getElementById('baseTitle').value;
        const th_level = docu
