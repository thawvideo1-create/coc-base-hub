<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ClashBase Hub - Professional COC Layouts</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0a0a0a; color: #f8fafc; padding-bottom: 95px; }
    
    /* Header */
    header { position: sticky; top: 0; z-index: 40; background-color: rgba(23, 23, 23, 0.95); border-bottom: 1px solid #262626; backdrop-filter: blur(8px); }
    .header-top { max-width: 480px; margin: 0 auto; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .logo { font-size: 19px; font-weight: 800; color: #f59e0b; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .logo i { font-size: 20px; }
    .controls { display: flex; align-items: center; gap: 6px; }
    
    .btn-lang { background: #262626; color: #f59e0b; border: 1px solid #404040; padding: 6px 9px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
    .select-box { background: #262626; color: #f59e0b; border: 1px solid #404040; padding: 6px 7px; border-radius: 6px; font-size: 11px; font-weight: bold; outline: none; cursor: pointer; }
    
    /* Category Scroll */
    .cat-bar { max-width: 480px; margin: 0 auto; padding: 4px 12px 10px; display: flex; gap: 6px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
    .cat-bar::-webkit-scrollbar { display: none; }
    .cat-btn { background: #262626; color: #cbd5e1; border: none; padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }
    .cat-btn.active { background: #f59e0b; color: #0a0a0a; }

    /* Ad Banner */
    .ad-box { max-width: 480px; margin: 10px auto 4px; padding: 0 14px; }
    .ad-inner { width: 100%; height: 48px; border: 1px dashed #334155; background: #171717; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #64748b; }

    /* Layout Cards */
    .feed { max-width: 480px; margin: 0 auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 16px; }
    .card { background: #171717; border: 1px solid #262626; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
    .img-wrap { position: relative; width: 100%; height: 215px; background: #000; }
    .img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .badge-th { position: absolute; top: 10px; left: 10px; background: #f59e0b; color: #000; font-size: 11px; font-weight: 900; padding: 3px 8px; border-radius: 6px; }
    .badge-cat { position: absolute; top: 10px; left: 66px; background: rgba(0,0,0,0.85); color: #f59e0b; border: 1px solid #404040; font-size: 10px; font-weight: bold; padding: 3px 7px; border-radius: 6px; }
    
    .card-body { padding: 14px 12px; }
    .card-title { font-size: 15px; font-weight: 700; color: #f8fafc; margin-bottom: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #262626; padding-top: 12px; }
    
    /* Meta Info */
    .meta-info { display: flex; gap: 16px; align-items: center; font-size: 13.5px; color: #cbd5e1; }
    .meta-item { display: flex; align-items: center; gap: 5px; font-weight: 600; }
    .meta-item i { color: #f59e0b; font-size: 14px; }
    .meta-time { display: flex; align-items: center; gap: 5px; color: #94a3b8; font-size: 13px; font-weight: 500; }
    .meta-time i { color: #94a3b8; font-size: 13px; }

    /* Larger Copy Button */
    .btn-copy { background: #f59e0b; color: #0a0a0a; border: none; padding: 8px 16px; border-radius: 9px; font-size: 13.5px; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: transform 0.1s; }
    .btn-copy:active { transform: scale(0.96); }
    .btn-copy i { font-size: 14px; }
    .btn-copy.done { background: #10b981; color: #fff; }

    /* Floating Add Button */
    .fab { position: fixed; bottom: 24px; right: 18px; width: 56px; height: 56px; background: #10b981; border: 2px solid #34d399; border-radius: 50%; color: #000; font-size: 24px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(0,0,0,0.6); cursor: pointer; z-index: 50; }
    .fab:active { transform: scale(0.94); }

    /* Modal */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 60; }
    .modal.show { display: flex; }
    .modal-box { background: #171717; border: 1px solid #262626; border-radius: 16px; width: 100%; max-width: 440px; padding: 18px; max-height: 90vh; overflow-y: auto; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .modal-head h2 { font-size: 16px; font-weight: bold; color: #f59e0b; }
    .modal-close { background: none; border: none; font-size: 20px; color: #94a3b8; cursor: pointer; padding: 4px; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    .form-input { width: 100%; background: #0a0a0a; border: 1px solid #262626; border-radius: 8px; padding: 9px 10px; color: #fff; font-size: 12px; outline: none; }
    .form-row { display: flex; gap: 8px; }
    .form-row > div { flex: 1; }
    .modal-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    .btn-cancel { background: #262626; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-size: 12px; cursor: pointer; }
    .btn-submit { background: #f59e0b; color: #000; border: none; padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }
    .status-hint { text-align: center; color: #94a3b8; font-size: 13px; padding: 30px 0; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-top">
      <div class="logo" id="homeLogo">
        <i class="fa-solid fa-shield-halved"></i> ClashBase
      </div>
      <div class="controls">
        <button type="button" class="btn-lang" id="langToggle">English</button>
        <select class="select-box" id="sortFilter">
          <option value="NEW">NEW</option>
          <option value="POPULAR">POPULAR</option>
        </select>
        <select class="select-box" id="thFilter">
          <option value="ALL">ALL TH</option>
          <option value="TH 18">TH 18</option>
          <option value="TH 17">TH 17</option>
          <option value="TH 16">TH 16</option>
          <option value="TH 15">TH 15</option>
          <option value="TH 14">TH 14</option>
          <option value="TH 13">TH 13</option>
          <option value="TH 12">TH 12</option>
          <option value="TH 11">TH 11</option>
          <option value="TH 10">TH 10</option>
        </select>
      </div>
    </div>

    <!-- Category Tabs -->
    <div class="cat-bar" id="catBar">
      <button type="button" class="cat-btn active" data-cat="ALL">All</button>
      <button type="button" class="cat-btn" data-cat="WAR">War</button>
      <button type="button" class="cat-btn" data-cat="CWL">CWL</button>
      <button type="button" class="cat-btn" data-cat="FARMING">Farming</button>
      <button type="button" class="cat-btn" data-cat="HYBRID">Hybrid</button>
      <button type="button" class="cat-btn" data-cat="RANK">Rank</button>
      <button type="button" class="cat-btn" data-cat="FUNNY">Funny</button>
    </div>
  </header>

  <!-- Banner Ad Slot -->
  <div class="ad-box">
    <div class="ad-inner" id="adPlaceholder">[ ကြော်ငြာနေရာ - Banner Ad ]</div>
  </div>

  <!-- Feed Container -->
  <main class="feed" id="feedContainer">
    <div class="status-hint" id="feedStatus">ဒေတာဆွဲတင်နေပါသည်...</div>
  </main>

  <!-- Floating Add Button -->
  <button type="button" class="fab" id="openAddModal">
    <i class="fa-solid fa-plus"></i>
  </button>

  <!-- Upload Modal -->
  <div class="modal" id="modalWindow">
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="modalTitle">Base အသစ်တင်ရန်</h2>
        <button type="button" class="modal-close" id="closeAddModal"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="newPostForm">
        <div class="form-group">
          <label id="lblTitle">ခေါင်းစဉ်</label>
          <input type="text" id="newTitle" required placeholder="ဥပမာ - Anti-2 Star CWL Base" class="form-input">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label id="lblTh">Town Hall</label>
            <select id="newTh" class="form-input">
              <option value="TH 18">TH 18</option>
              <option value="TH 17">TH 17</option>
              <option value="TH 16">TH 16</option>
              <option value="TH 15">TH 15</option>
              <option value="TH 14">TH 14</option>
              <option value="TH 13">TH 13</option>
              <option value="TH 12">TH 12</option>
              <option value="TH 11">TH 11</option>
              <option value="TH 10">TH 10</option>
            </select>
          </div>
          <div class="form-group">
            <label id="lblType">အမျိုးအစား</label>
            <select id="newCat" class="form-input">
              <option value="WAR">WAR</option>
              <option value="RANK">RANK</option>
              <option value="CWL">CWL</option>
              <option value="HYBRID">HYBRID</option>
              <option value="FARMING">FARMING</option>
              <option value="FUNNY">FUNNY</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label id="lblLink">COC Layout Link</label>
          <input type="url" id="newLink" required placeholder="https://link.clashofclans.com/en?action=OpenLayout&id=..." class="form-input">
        </div>
        <div class="form-group">
          <label id="lblImg">Base ဓာတ်ပုံ (Gallery မှ ရွေးပါ)</label>
          <input type="file" id="newFile" accept="image/*" required class="form-input" style="padding: 5px;">
        </div>
        <div class="modal-btns">
          <button type="button" class="btn-cancel" id="cancelAddModal">ပိတ်မည်</button>
          <button type="submit" class="btn-submit" id="submitAddModal">တင်မည်</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    var PROXY_URL = "https://orange-sun-6c0d.thawzinlatt-tt.workers.dev";
    var API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6c29kcHNoaGloZWxlbW93enZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4MjkwNDQsImV4cCI6MjEwNjQwNTA0NH0.x-gP_4a4rcKAjAhNgtegDlq8XD542Y3ufH54J6FVWlo";

    var activeTh = 'ALL';
    var activeCat = 'ALL';
    var isBurmese = true;
    var allBases = [];

    // Local Storage မှ အရန်ဒေတာများ ဖတ်ယူခြင်း
    try {
      var cached = localStorage.getItem('stored_coc_bases');
      if (cached) {
        var parsed = JSON.parse(cached);
        if (Array.isArray(parsed)) allBases = parsed;
      }
    } catch(e) {}

    function formatTime(dateStr) {
      if (!dateStr) return isBurmese ? "ခုနက" : "Just now";
      var d = new Date(dateStr);
      var now = new Date();
      var diffSec = Math.max(0, Math.floor((now - d) / 1000));
      if (diffSec < 60) return isBurmese ? "ခုနက" : "Just now";
      var diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return diffMin + "m " + (isBurmese ? "က" : "ago");
      var diffHr = Math.floor(diffMin / 60);
      if (diffHr < 24) return diffHr + "h " + (isBurmese ? "က" : "ago");
      var diffDay = Math.floor(diffHr / 24);
      return diffDay + "d " + (isBurmese ? "က" : "ago");
    }

    function renderFeed() {
      var container = document.getElementById('feedContainer');
      var sortMode = document.getElementById('sortFilter').value;

      var filtered = allBases.filter(function(b) {
        var matchTh = (activeTh === 'ALL' || (b.th_level || b.th || '').toUpperCase() === activeTh);
        var matchCat = (activeCat === 'ALL' || (b.base_type || b.cat || '').toUpperCase() === activeCat);
        return matchTh && matchCat;
      });

      if (sortMode === 'POPULAR') {
        filtered.sort(function(a, b) { return (Number(b.copy_count || b.copies) || 0) - (Number(a.copy_count || a.copies) || 0); });
      } else {
        filtered.sort(function(a, b) { return new Date(b.created_at || b.id || 0) - new Date(a.created_at || a.id || 0); });
      }

      if (filtered.length === 0) {
        container.innerHTML = '<div class="status-hint">' + (isBurmese ? 'တင်ထားသော Base မရှိသေးပါ။ အောက်က + ခလုတ်ကို နှိပ်၍ စတင်တင်နိုင်ပါသည်ခင်ဗျာ။' : 'No bases found. Click + button to upload.') + '</div>';
        return;
      }

      var html = '';
      for (var i = 0; i < filtered.length; i++) {
        var b = filtered[i];
        var imgUrl = b.image_url || b.img;
        if (imgUrl && imgUrl.indexOf('supabase.co') !== -1) {
          imgUrl = imgUrl.replace('https://jzsodpshhihelemowzvn.supabase.co', PROXY_URL);
        }

        html += '<div class="card">' +
          '<div class="img-wrap">' +
            '<img src="' + imgUrl + '" alt="Base" onerror="this.src=\'https://placehold.co/600x400/1e293b/94a3b8?text=COC+Base\'">' +
            '<span class="badge-th">' + (b.th_level || b.th) + '</span>' +
            '<span class="badge-cat">' + (b.base_type || b.cat) + '</span>' +
          '</div>' +
          '<div class="card-body">' +
            '<div class="card-title">' + b.title + '</div>' +
            '<div class="card-footer">' +
              '<div class="meta-info">' +
                '<span class="meta-item"><i class="fa-regular fa-copy"></i> <b class="copy-cnt">' + (b.copy_count || b.copies || 0) + '</b></span>' +
                '<span class="meta-time"><i class="fa-regular fa-clock"></i> <span class="time-val">' + formatTime(b.created_at) + '</span></span>' +
              '</div>' +
              '<button type="button" class="btn-copy" data-id="' + b.id + '" data-link="' + b.link + '" onclick="handleCopyBtn(this)">' +
                '<i class="fa-solid fa-download"></i> <span class="copy-txt">Copy Layout</span>' +
              '</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      }
      container.innerHTML = html;
    }

    // ဆာဗာမှ ဒေတာဆွဲတင်ခြင်း (Background Fetch with Timeout)
    function fetchAllBases() {
      var controller = new AbortController();
      var timeout = setTimeout(function() { controller.abort(); }, 5000);

      fetch(PROXY_URL + '/rest/v1/bases?select=*&order=created_at.desc', {
        signal: controller.signal,
        headers: {
          'apikey': API_KEY,
          'Authorization': 'Bearer ' + API_KEY
        }
      })
      .then(function(res) {
        clearTimeout(timeout);
        return res.json();
      })
      .then(function(data) {
        if (Array.isArray(data) && data.length > 0) {
          allBases = data;
          try { localStorage.setItem('stored_coc_bases', JSON.stringify(allBases)); } catch(e) {}
          renderFeed();
        }
      })
      .catch(function(err) {
        console.warn("Could not load from remote server, using local data", err);
        renderFeed();
      });
    }

    // Category Tabs Event
    var catButtons = document.querySelectorAll('.cat-btn');
    for (var i = 0; i < catButtons.length; i++) {
      catButtons[i].onclick = function() {
        activeCat = this.getAttribute('data-cat');
        for (var j = 0; j < catButtons.length; j++) catButtons[j].classList.remove('active');
        this.classList.add('active');
        renderFeed();
      };
    }

    // Filters
    document.getElementById('thFilter').onchange = function() { activeTh = this.value; renderFeed(); };
    document.getElementById('sortFilter').onchange = function() { renderFeed(); };
    document.getElementById('homeLogo').onclick = function() {
      activeTh = 'ALL'; activeCat = 'ALL';
      document.getElementById('thFilter').value = 'ALL';
      document.getElementById('sortFilter').value = 'NEW';
      for (var i = 0; i < catButtons.length; i++) catButtons[i].classList.remove('active');
      catButtons[0].classList.add('active');
      renderFeed();
    };

    // Language Toggle
    document.getElementById('langToggle').onclick = function() {
      isBurmese = !isBurmese;
      this.innerText = isBurmese ? "English" : "မြန်မာစာ";
      document.getElementById('adPlaceholder').innerText = isBurmese ? "[ ကြော်ငြာနေရာ - Banner Ad ]" : "[ Advertisement - Banner Ad ]";
      document.getElementById('modalTitle').innerText = isBurmese ? "Base အသစ်တင်ရန်" : "Share New Base";
      document.getElementById('lblTitle').innerText = isBurmese ? "ခေါင်းစဉ်" : "Base Title";
      document.getElementById('lblTh').innerText = isBurmese ? "Town Hall" : "Town Hall";
      document.getElementById('lblType').innerText = isBurmese ? "အမျိုးအစား" : "Category";
      document.getElementById('lblLink').innerText = isBurmese ? "COC Layout Link" : "COC Layout Link";
      document.getElementById('lblImg').innerText = isBurmese ? "Base ဓာတ်ပုံ (Gallery မှ ရွေးပါ)" : "Base Screenshot";
      document.getElementById('cancelAddModal').innerText = isBurmese ? "ပိတ်မည်" : "Cancel";
      document.getElementById('submitAddModal').innerText = isBurmese ? "တင်မည်" : "Publish";
      renderFeed();
    };

    // Copy Layout Action (COC Game တိုက်ရိုက်ပွင့်ခြင်း)
    window.handleCopyBtn = function(btn) {
      var link = btn.getAttribute('data-link');
      var id = btn.getAttribute('data-id');
      if (!link) return;

      var cleanLink = link.trim();

      for (var i = 0; i < allBases.length; i++) {
        if (String(allBases[i].id) === String(id)) {
          allBases[i].copy_count = (Number(allBases[i].copy_count || allBases[i].copies) || 0) + 1;
          break;
        }
      }
      try { localStorage.setItem('stored_coc_bases', JSON.stringify(allBases)); } catch(e) {}

      var card = btn.closest('.card');
      if (card) {
        var cnt = card.querySelector('.copy-cnt');
        if (cnt) cnt.innerText = parseInt(cnt.innerText || 0) + 1;
      }

      fetch(PROXY_URL + '/rest/v1/rpc/increment_copy', {
        method: 'POST',
        headers: {
          'apikey': API_KEY,
          'Authorization': 'Bearer ' + API_KEY,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ base_id: Number(id) })
      }).catch(function() {});

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(cleanLink).catch(function() {});
      }

      var txtSpan = btn.querySelector('.copy-txt');
      if (txtSpan) txtSpan.innerText = "Copied!";
      btn.classList.add('done');

      window.location.href = cleanLink;

      setTimeout(function() {
        btn.classList.remove('done');
        if (txtSpan) txtSpan.innerText = "Copy Layout";
      }, 2000);
    };

    // Modal Events
    var modal = document.getElementById('modalWindow');
    document.getElementById('openAddModal').onclick = function() { modal.classList.add('show'); };
    function closeModal() { modal.classList.remove('show'); }
    document.getElementById('closeAddModal').onclick = closeModal;
    document.getElementById('cancelAddModal').onclick = closeModal;

    // Canvas Compression (Blob နှင့် Base64 နှစ်မျိုးစလုံး ထုတ်ယူခြင်း)
    function compressImageFile(file, callback) {
      var reader = new FileReader();
      reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
          var canvas = document.createElement('canvas');
          var maxWidth = 800;
          var width = img.width;
