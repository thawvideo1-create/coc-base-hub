<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClashBase Hub - Share & Find Clash Layouts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-950 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center gap-2">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-shield-halved text-amber-500 text-2xl"></i>
        <h1 class="text-lg sm:text-xl font-bold tracking-wide">ClashBase Hub</h1>
      </div>
      
      <div class="flex items-center gap-2 sm:gap-3">
        <!-- Language Switcher Button -->
        <button onclick="toggleLanguage()" class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs sm:text-sm font-semibold px-2.5 py-1.5 rounded-lg border border-slate-700 transition">
          <i class="fa-solid fa-globe text-amber-400"></i>
          <span id="langBtnText">English</span>
        </button>

        <button onclick="openModal()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold px-3 sm:px-4 py-1.5 sm:py-2 rounded-lg text-xs sm:text-sm transition flex items-center">
          <i class="fa-solid fa-plus mr-1"></i> <span data-i18n="addBaseBtn">Base တင်မည်</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Banner Ad Slot -->
  <div class="max-w-6xl mx-auto px-4 my-4">
    <div class="w-full h-20 bg-slate-800/40 border border-dashed border-slate-700 rounded-lg flex items-center justify-center text-slate-500 text-xs sm:text-sm">
      <span data-i18n="adPlaceholder">[ ကြော်ငြာနေရာ - Banner Ad ]</span>
    </div>
  </div>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 py-4">
    <h2 class="text-base sm:text-lg font-bold mb-4 text-slate-300" data-i18n="latestBases">နောက်ဆုံးတင်ထားသော Base များ</h2>
    <div id="basesGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
      <div class="text-slate-400 text-sm col-span-full py-8 text-center" data-i18n="loadingText">Loading bases...</div>
    </div>
  </main>

  <!-- Upload Modal -->
  <div id="uploadModal" class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 hidden z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-md w-full p-6">
      <h2 class="text-lg font-bold mb-4" data-i18n="modalTitle">Base အသစ်တင်ရန်</h2>
      <form onsubmit="handleUpload(event)" class="space-y-3">
        <div>
          <label class="text-xs text-slate-400 block mb-1" data-i18n="labelTitle">ခေါင်းစဉ်</label>
          <input type="text" id="baseTitle" required placeholder="ဥပမာ - Anti-2 Star CWL Base" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-amber-500">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs text-slate-400 block mb-1" data-i18n="labelTownHall">Town Hall</label>
            <select id="thLevel" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white">
              <option value="TH 18">TH 18</option>
              <option value="TH 17">TH 17</option>
              <option value="TH 16">TH 16</option>
              <option value="TH 15">TH 15</option>
              <option value="TH 14">TH 14</option>
              <option value="TH 13">TH 13</option>
              <option value="TH 12">TH 12</option>
              <option value="TH 11">TH 11</option>
              <option value="TH 10">TH 10</option>
              <option value="TH 9">TH 9</option>
            </select>
          </div>
          <div>
            <label class="text-xs text-slate-400 block mb-1" data-i18n="labelBaseType">Base အမျိုးအစား</label>
            <select id="baseType" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white">
              <option value="War Base" data-i18n-opt="warBase">War Base</option>
              <option value="Trophy Base" data-i18n-opt="trophyBase">Trophy Base</option>
              <option value="Farming Base" data-i18n-opt="farmingBase">Farming Base</option>
            </select>
          </div>
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1" data-i18n="labelLink">COC Layout Link</label>
          <input type="url" id="baseLink" required placeholder="https://link.clashofclans.com/..." class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1" data-i18n="labelImage">ဓာတ်ပုံ Link (Image URL)</label>
          <input type="url" id="imageUrl" required placeholder="https://..." class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-amber-500">
        </div>
        <div class="flex justify-end gap-2 pt-3">
          <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded text-sm" data-i18n="cancelBtn">ပိတ်မည်</button>
          <button type="submit" id="submitBtn" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 font-bold text-slate-950 rounded text-sm" data-i18n="submitBtn">တင်မည်</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Supabase Configuration
    const SUPABASE_URL = "https://jzsodpshhihelemowzvn.supabase.co";
    const SUPABASE_ANON_KEY = "Sb_publishable_iZthfHzEZ5NwYnm3479NyQ_fUvcekcG";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Multilingual Translations Dictionary
    const translations = {
      my: {
        switchText: "English",
        addBaseBtn: "Base တင်မည်",
        adPlaceholder: "[ ကြော်ငြာနေရာ - Banner Ad ]",
        latestBases: "နောက်ဆုံးတင်ထားသော Base များ",
        loadingText: "ဒေတာဆွဲတင်နေပါသည်...",
        noBasesText: "တင်ထားသော Base မရှိသေးပါ။ ပထမဆုံး Base စတင်တင်ကြည့်ပါ!",
        modalTitle: "Base အသစ်တင်ရန်",
        labelTitle: "ခေါင်းစဉ်",
        labelTownHall: "Town Hall",
        labelBaseType: "Base အမျိုးအစား",
        warBase: "War Base",
        trophyBase: "Trophy Base",
        farmingBase: "Farming Base",
        labelLink: "COC Layout Link",
        labelImage: "ဓာတ်ပုံ Link (Image URL)",
        cancelBtn: "ပိတ်မည်",
        submitBtn: "တင်မည်",
        uploading: "တင်နေပါသည်...",
        copyBtn: "Copy",
        errorPrefix: "အမှားဖြစ်သွားပါသည်: ",
        successMsg: "Base အောင်မြင်စွာ တင်ပြီးပါပြီ!",
        placeholderTitle: "ဥပမာ - Anti-2 Star CWL Base"
      },
      en: {
        switchText: "မြန်မာစာ",
        addBaseBtn: "Submit Base",
        adPlaceholder: "[ Advertisement - Banner Ad ]",
        latestBases: "Latest Layouts",
        loadingText: "Loading layouts...",
        noBasesText: "No bases found yet. Be the first to share one!",
        modalTitle: "Share New Base Layout",
        labelTitle: "Layout Title",
        labelTownHall: "Town Hall Level",
        labelBaseType: "Base Category",
        warBase: "War Base",
        trophyBase: "Trophy Base",
        farmingBase: "Farming Base",
        labelLink: "COC In-Game Link",
        labelImage: "Screenshot Image URL",
        cancelBtn: "Cancel",
        submitBtn: "Publish Base",
        uploading: "Uploading...",
        copyBtn: "Copy Link",
        errorPrefix: "Error occurred: ",
        successMsg: "Base layout submitted successfully!",
        placeholderTitle: "e.g. Anti-2 Star CWL Base"
      }
    };

    let currentLang = localStorage.getItem('site_lang') || 'my';

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('site_lang', lang);
      document.documentElement.lang = lang;

      const t = translations[lang];
      document.getElementById('langBtnText').innerText = t.switchText;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.innerText = t[key];
      });

      document.getElementById('baseTitle').placeholder = t.placeholderTitle;

      document.querySelectorAll('[data-i18n-opt]').forEach(el => {
        const key = el.getAttribute('data-i18n-opt');
        if (t[key]) el.innerText = t[key];
      });

      fetchBases();
    }

    function toggleLanguage() {
      setLanguage(currentLang === 'my' ? 'en' : 'my');
    }

    function openModal() { document.getElementById('uploadModal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('uploadModal').classList.add('hidden'); }

    async function fetchBases() {
      const { data, error } = await db.from('bases').select('*').order('created_at', { ascending: false });
      const grid = document.getElementById('basesGrid');
      const t = translations[currentLang];
      
      if (error || !data || data.length === 0) {
        grid.innerHTML = `<div class="text-slate-400 text-sm col-span-full py-8 text-center">${t.noBasesText}</div>`;
        return;
      }

      grid.innerHTML = data.map(b => `
        <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-lg flex flex-col hover:border-slate-600 transition">
          <div class="relative">
            <img src="${b.image_url}" alt="${b.title}" class="w-full h-48 object-cover" onerror="this.src='https://placehold.co/600x400/1e293b/94a3b8?text=Base+Photo'">
            <span class="absolute top-2 left-2 bg-amber-500 text-slate-950 text-xs font-bold px-2 py-1 rounded">${b.th_level}</span>
            <span class="absolute top-2 right-2 bg-slate-900/80 text-xs px-2 py-1 rounded backdrop-blur-sm">${b.base_type}</span>
          </div>
          <div class="p-4 flex-1 flex flex-col justify-between">
            <h3 class="font-bold text-lg mb-3 line-clamp-1">${b.title}</h3>
            <div class="flex items-center justify-between pt-3 border-t border-slate-700">
              <span class="text-xs text-slate-400">COC Layout</span>
              <a href="${b.link}" target="_blank" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-1.5 rounded-lg text-sm flex items-center gap-1 transition">
                <i class="fa-solid fa-copy"></i> ${t.copyBtn}
              </a>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function handleUpload(e) {
      e.preventDefault();
      const t = translations[currentLang];
      const btn = document.getElementById('submitBtn');
      btn.innerText = t.uploading;
      btn.disabled = true;

      const title = document.getElementById('baseTitle').value;
      const th_level = document.getElementById('thLevel').value;
      const base_type = document.getElementById('baseType').value;
      const link = document.getElementById('baseLink').value;
      const image_url = document.getElementById('imageUrl').value;

      const { error } = await db.from('bases').insert([{ title, th_level, base_type, link, image_url }]);

      btn.innerText = t.submitBtn;
      btn.disabled = false;

      if (error) {
        alert(t.errorPrefix + error.message);
      } else {
        alert(t.successMsg);
        e.target.reset();
        closeModal();
        fetchBases();
      }
    }

    // Initialize Language & Fetch Content
    setLanguage(currentLang);
  </script>
</body>
</html>
