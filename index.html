<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClashBase Hub - Professional COC Layouts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-neutral-950 text-slate-100 min-h-screen pb-20 select-none">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-neutral-900/95 backdrop-blur-md border-b border-neutral-800">
    <div class="max-w-md mx-auto px-4 py-2.5 flex justify-between items-center gap-1">
      <div class="flex items-center gap-1.5 cursor-pointer" onclick="filterBases('ALL', 'ALL')">
        <i class="fa-solid fa-shield-halved text-amber-500 text-xl"></i>
        <span class="font-extrabold text-lg tracking-wider bg-gradient-to-r from-amber-400 to-amber-600 bg-clip-text text-transparent">ClashBase</span>
      </div>

      <div class="flex items-center gap-1.5">
        <!-- Language Switcher -->
        <button type="button" id="langBtn" onclick="toggleLang()" class="px-2.5 py-1 rounded bg-neutral-800 hover:bg-neutral-700 text-xs font-bold border border-neutral-700 text-amber-400 cursor-pointer">
          English
        </button>

        <!-- Sort Native Select -->
        <select id="sortSelect" onchange="sortBases(this.value)" class="bg-neutral-800 text-amber-400 text-xs font-bold px-2 py-1 rounded-lg border border-neutral-700 focus:outline-none cursor-pointer">
          <option value="NEW">⚡ NEW</option>
          <option value="POPULAR">🔥 POPULAR</option>
        </select>

        <!-- TH Select Dropdown (TH 10 မှ TH 18) -->
        <select id="thSelect" onchange="onThChange(this.value)" class="bg-neutral-800 text-amber-400 text-xs font-bold px-2 py-1 rounded-lg border border-neutral-700 focus:outline-none cursor-pointer">
          <option value="ALL">ALL TH</option>
          <option value="TH 18">TH 18</option>
          <option value="TH 17">TH 17</option>
          <option value="TH 16">TH 16</option>
          <option value="TH 15">TH 15</option>
          <option value="TH 14">TH 14</option>
          <option value="TH 13">TH 13</option>
          <option value="TH 12">TH 12</option>
          <option value="TH 11">TH 11</option>
          <option value="TH 10">TH 10</option>
        </select>
      </div>
    </div>

    <!-- Category Tabs -->
    <div class="max-w-md mx-auto px-3 pb-2 pt-1 flex items-center gap-1.5 overflow-x-auto no-scrollbar text-xs font-bold">
      <button type="button" onclick="onCatChange('ALL', this)" class="cat-btn px-3 py-1 rounded-lg bg-amber-500 text-neutral-950 whitespace-nowrap cursor-pointer">All</button>
      <button type="button" onclick="onCatChange('WAR', this)" class="cat-btn px-3 py-1 rounded-lg bg-neutral-800 text-slate-300 whitespace-nowrap cursor-pointer">War</button>
      <button type="button" onclick="onCatChange('CWL', this)" class="cat-btn px-3 py-1 rounded-lg bg-neutral-800 text-slate-300 whitespace-nowrap cursor-pointer">CWL</button>
      <button type="button" onclick="onCatChange('FARMING', this)" class="cat-btn px-3 py-1 rounded-lg bg-neutral-800 text-slate-300 whitespace-nowrap cursor-pointer">Farming</button>
      <button type="button" onclick="onCatChange('HYBRID', this)" class="cat-btn px-3 py-1 rounded-lg bg-neutral-800 text-slate-300 whitespace-nowrap cursor-pointer">Hybrid</button>
      <button type="button" onclick="onCatChange('RANK', this)" class="cat-btn px-3 py-1 rounded-lg bg-neutral-800 text-slate-300 whitespace-nowrap cursor-pointer">Rank</button>
      <button type="button" onclick="onCatChange('FUNNY', this)" class="cat-btn px-3 py-1 rounded-lg bg-neutral-800 text-slate-300 whitespace-nowrap cursor-pointer">Funny</button>
    </div>
  </header>

  <!-- Banner Ad Slot -->
  <div class="max-w-md mx-auto px-4 mt-2">
    <div class="w-full h-12 bg-neutral-900 border border-dashed border-neutral-800 rounded-xl flex items-center justify-center text-neutral-500 text-xs">
      <span id="adText">[ ကြော်ငြာနေရာ - Banner Ad ]</span>
    </div>
  </div>

  <!-- Feed Container (Pure HTML တိုက်ရိုက်ပါဝင်သော Base များ) -->
  <main class="max-w-md mx-auto px-3 py-3">
    <div id="basesList" class="space-y-4">

      <!-- Base 1 -->
      <div class="base-card bg-neutral-900 border border-neutral-800 rounded-2xl overflow-hidden shadow-lg flex flex-col" data-th="TH 18" data-cat="WAR" data-copies="152">
        <div class="relative bg-neutral-950">
          <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=800&auto=format&fit=crop&q=80" alt="TH 18 Anti-3 Star Base" class="w-full h-56 object-cover">
          <div class="absolute top-2.5 left-2.5 flex items-center gap-1.5">
            <span class="bg-amber-500 text-neutral-950 text-[11px] font-black px-2 py-0.5 rounded-md shadow">TH 18</span>
            <span class="bg-neutral-900/90 text-amber-400 border border-neutral-700 text-[10px] font-bold px-2 py-0.5 rounded-md backdrop-blur-sm">WAR</span>
          </div>
        </div>
        <div class="p-3">
          <h3 class="font-bold text-sm mb-2.5 line-clamp-1 text-slate-100">TH 18 Anti-3 Star Legend Base</h3>
          <div class="flex items-center justify-between text-neutral-400 text-xs border-t border-neutral-800/80 pt-2.5">
            <div class="flex items-center gap-4">
              <span class="flex items-center gap-1 font-semibold text-slate-300">
                <i class="fa-regular fa-copy text-amber-400"></i>
                <span class="copy-num">152</span>
              </span>
              <span class="flex items-center gap-1 text-[11px]">
                <i class="fa-regular fa-clock"></i> <span>1h က</span>
              </span>
            </div>
            <button type="button" onclick="copyLink('https://link.clashofclans.com/en', this)" class="copy-btn-el bg-amber-500 hover:bg-amber-600 text-neutral-950 font-bold px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5 transition cursor-pointer">
              <i class="fa-solid fa-download"></i> <span>Copy Layout</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Base 2 -->
      <div class="base-card bg-neutral-900 border border-neutral-800 rounded-2xl overflow-hidden shadow-lg flex flex-col" data-th="TH 17" data-cat="CWL" data-copies="89">
        <div class="relative bg-neutral-950">
          <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?w=800&auto=format&fit=crop&q=80" alt="TH 17 CWL Base" class="w-full h-56 object-cover">
          <div class="absolute top-2.5 left-2.5 flex items-center gap-1.5">
            <span class="bg-amber-500 text-neutral-950 text-[11px] font-black px-2 py-0.5 rounded-md shadow">TH 17</span>
            <span class="bg-neutral-900/90 text-amber-400 border border-neutral-700 text-[10px] font-bold px-2 py-0.5 rounded-md backdrop-blur-sm">CWL</span>
          </div>
        </div>
        <div class="p-3">
          <h3 class="font-bold text-sm mb-2.5 line-clamp-1 text-slate-100">TH 17 Defensive CWL Hard Base</h3>
          <div class="flex items-center justify-between text-neutral-400 text-xs border-t border-neutral-800/80 pt-2.5">
            <div class="flex items-center gap-4">
              <span class="flex items-center gap-1 font-semibold text-slate-300">
                <i class="fa-regular fa-copy text-amber-400"></i>
                <span class="copy-num">89</span>
              </span>
              <span class="flex items-center gap-1 text-[11px]">
                <i class="fa-regular fa-clock"></i> <span>3h က</span>
              </span>
            </div>
            <button type="button" onclick="copyLink('https://link.clashofclans.com/en', this)" class="copy-btn-el bg-amber-500 hover:bg-amber-600 text-neutral-950 font-bold px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5 transition cursor-pointer">
              <i class="fa-solid fa-download"></i> <span>Copy Layout</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Base 3 -->
      <div class="base-card bg-neutral-900 border border-neutral-800 rounded-2xl overflow-hidden shadow-lg flex flex-col" data-th="TH 16" data-cat="RANK" data-copies="240">
        <div class="relative bg-neutral-950">
          <img src="https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=800&auto=format&fit=crop&q=80" alt="TH 16 Trophy Base" class="w-full h-56 object-cover">
          <div class="absolute top-2.5 left-2.5 flex items-center gap-1.5">
            <span class="bg-amber-500 text-neutral-950 text-[11px] font-black px-2 py-0.5 rounded-md shadow">TH 16</span>
            <span class="bg-neutral-900/90 text-amber-400 border border-neutral-700 text-[10px] font-bold px-2 py-0.5 rounded-md backdrop-blur-sm">RANK</span>
          </div>
        </div>
        <div class="p-3">
          <h3 class="font-bold text-sm mb-2.5 line-clamp-1 text-slate-100">TH 16 Trophy Push & Legend League</h3>
          <div class="flex items-center justify-between text-neutral-400 text-xs border-t border-neutral-800/80 pt-2.5">
            <div class="flex items-center gap-4">
              <span class="flex items-center gap-1 font-semibold text-slate-300">
                <i class="fa-regular fa-copy text-amber-400"></i>
                <span class="copy-num">240</span>
              </span>
              <span class="flex items-center gap-1 text-[11px]">
                <i class="fa-regular fa-clock"></i> <span>5h က</span>
              </span>
            </div>
            <button type="button" onclick="copyLink('https://link.clashofclans.com/en', this)" class="copy-btn-el bg-amber-500 hover:bg-amber-600 text-neutral-950 font-bold px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5 transition cursor-pointer">
              <i class="fa-solid fa-download"></i> <span>Copy Layout</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Base 4 -->
      <div class="base-card bg-neutral-900 border border-neutral-800 rounded-2xl overflow-hidden shadow-lg flex flex-col" data-th="TH 15" data-cat="FARMING" data-copies="65">
        <div class="relative bg-neutral-950">
          <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=800&auto=format&fit=crop&q=80" alt="TH 15 Farming Base" class="w-full h-56 object-cover">
          <div class="absolute top-2.5 left-2.5 flex items-center gap-1.5">
            <span class="bg-amber-500 text-neutral-950 text-[11px] font-black px-2 py-0.5 rounded-md shadow">TH 15</span>
            <span class="bg-neutral-900/90 text-amber-400 border border-neutral-700 text-[10px] font-bold px-2 py-0.5 rounded-md backdrop-blur-sm">FARMING</span>
          </div>
        </div>
        <div class="p-3">
          <h3 class="font-bold text-sm mb-2.5 line-clamp-1 text-slate-100">TH 15 Resource & Dark Elixir Protection</h3>
          <div class="flex items-center justify-between text-neutral-400 text-xs border-t border-neutral-800/80 pt-2.5">
            <div class="flex items-center gap-4">
              <span class="flex items-center gap-1 font-semibold text-slate-300">
                <i class="fa-regular fa-copy text-amber-400"></i>
                <span class="copy-num">65</span>
              </span>
              <span class="flex items-center gap-1 text-[11px]">
                <i class="fa-regular fa-clock"></i> <span>8h က</span>
              </span>
            </div>
            <button type="button" onclick="copyLink('https://link.clashofclans.com/en', this)" class="copy-btn-el bg-amber-500 hover:bg-amber-600 text-neutral-950 font-bold px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5 transition cursor-pointer">
              <i class="fa-solid fa-download"></i> <span>Copy Layout</span>
            </button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Floating Action Button (+ Post Base) -->
  <button type="button" onclick="toggleModal(true)" class="fixed bottom-6 right-4 z-40 bg-emerald-500 hover:bg-emerald-600 text-neutral-950 w-14 h-14 rounded-full shadow-2xl flex items-center justify-center text-2xl transition transform active:scale-95 border-2 border-emerald-400/40 cursor-pointer">
    <i class="fa-solid fa-plus font-black"></i>
  </button>

  <!-- Upload Modal -->
  <div id="uploadModal" class="fixed inset-0 bg-black/85 flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-neutral-900 border border-neutral-800 rounded-2xl max-w-md w-full p-5 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-3">
        <h2 id="modalTitle" class="text-base font-bold text-amber-400">Base အသစ်တင်ရန်</h2>
        <button type="button" onclick="toggleModal(false)" class="text-neutral-400 hover:text-white p-2 text-2xl font-bold cursor-pointer">&times;</button>
      </div>

      <form onsubmit="handlePostSubmit(event)" class="space-y-3">
        <div>
          <label id="lblTitle" class="text-xs text-neutral-400 block mb-1">ခေါင်းစဉ်</label>
          <input type="text" id="postTitle" required placeholder="ဥပမာ - Anti-3 Star CWL Base" class="w-full bg-neutral-950 border border-neutral-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-amber-500">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs text-neutral-400 block mb-1">Town Hall</label>
            <select id="postTh" class="w-full bg-neutral-950 border border-neutral-800 rounded-lg p-2.5 text-xs text-white">
              <option value="TH 18">TH 18</option>
              <option value="TH 17">TH 17</option>
              <option value="TH 16">TH 16</option>
              <option value="TH 15">TH 15</option>
              <option value="TH 14">TH 14</option>
              <option value="TH 13">TH 13</option>
              <option value="TH 12">TH 12</option>
              <option value="TH 11">TH 11</option>
              <option value="TH 10">TH 10</option>
            </select>
          </div>
          <div>
            <label class="text-xs text-neutral-400 block mb-1">အမျိုးအစား</label>
            <select id="postCat" class="w-full bg-neutral-950 border border-neutral-800 rounded-lg p-2.5 text-xs text-white font-medium">
              <option value="WAR">WAR</option>
              <option value="RANK">RANK</option>
              <option value="CWL">CWL</option>
              <option value="HYBRID">HYBRID</option>
              <option value="FARMING">FARMING</option>
              <option value="FUNNY">FUNNY</option>
            </select>
          </div>
        </div>

        <div>
          <label class="text-xs text-neutral-400 block mb-1">COC Layout Link</label>
          <input type="url" id="postLink" required placeholder="https://link.clashofclans.com/..." class="w-full bg-neutral-950 border border-neutral-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-amber-500">
        </div>

        <div>
          <label class="text-xs text-neutral-400 block mb-1">Base ဓာတ်ပုံ (Gallery မှ ရွေးပါ)</label>
          <input type="file" id="postImg" accept="image/*" required class="w-full text-xs text-slate-400 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-neutral-800 file:text-amber-400 hover:file:bg-neutral-700 cursor-pointer">
        </div>

        <div class="flex justify-end gap-2 pt-3">
          <button type="button" onclick="toggleModal(false)" id="btnCancel" class="px-4 py-2 bg-neutral-800 hover:bg-neutral-700 rounded-lg text-xs cursor-pointer">ပိတ်မည်</button>
          <button type="submit" id="btnSubmit" class="px-5 py-2 bg-amber-500 hover:bg-amber-600 font-bold text-neutral-950 rounded-lg text-xs cursor-pointer">တင်မည်</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    var currentTh = 'ALL';
    var currentCat = 'ALL';
    var isMy = true;

    function applyFilter() {
      var cards = document.querySelectorAll('.base-card');
      cards.forEach(function(card) {
        var cardTh = card.getAttribute('data-th');
        var cardCat = card.getAttribute('data-cat');

        var matchTh = (currentTh === 'ALL' || currentTh === cardTh);
        var matchCat = (currentCat === 'ALL' || currentCat === cardCat);

        if (matchTh && matchCat) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    }

    function onThChange(val) {
      currentTh = val;
      applyFilter();
    }

    function onCatChange(cat, btn) {
      currentCat = cat;
      document.querySelectorAll('.cat-btn').forEach(function(b) {
        b.className = "cat-btn px-3 py-1 rounded-lg bg-neutral-800 text-slate-300 whitespace-nowrap cursor-pointer";
      });
      if (btn) {
        btn.className = "cat-btn px-3 py-1 rounded-lg bg-amber-500 text-neutral-950 whitespace-nowrap cursor-pointer";
      }
      applyFilter();
    }

    function filterBases(th, cat) {
      currentTh = th;
      currentCat = cat;
      var thEl = document.getElementById('thSelect');
      if (thEl) thEl.value = th;
      var firstCat = document.querySelector('.cat-btn');
      onCatChange('ALL', firstCat);
    }

    function sortBases(type) {
      var container = document.getElementById('basesList');
      var cards = Array.from(document.querySelectorAll('.base-card'));

      if (type === 'POPULAR') {
        cards.sort(function(a, b) {
          return parseInt(b.getAttribute('data-copies') || 0) - parseInt(a.getAttribute('data-copies') || 0);
        });
      }
      cards.forEach(function(card) {
        container.appendChild(card);
      });
    }

    function copyLink(link, btn) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(link).catch(function() {});
      }
      var card = btn.closest('.base-card');
      var numSpan = card.querySelector('.copy-num');
      if (numSpan) {
        var count = parseInt(numSpan.innerText) + 1;
        numSpan.innerText = count;
        card.setAttribute('data-copies', count);
      }

      var origHtml = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-check"></i> ' + (isMy ? 'Copied!' : 'Copied!');
      btn.classList.replace('bg-amber-500', 'bg-emerald-500');

      setTimeout(function() {
        btn.innerHTML = origHtml;
        btn.classList.replace('bg-emerald-500', 'bg-amber-500');
        if (link) window.open(link, '_blank');
      }, 400);
    }

    function toggleModal(show) {
      var modal = document.getElementById('uploadModal');
      if (modal) {
        if (show) modal.classList.remove('hidden');
        else modal.classList.add('hidden');
      }
    }

    function toggleLang() {
      isMy = !isMy;
      var langBtn = document.getElementById('langBtn');
      var ad = document.getElementById('adText');
      var mTitle = document.getElementById('modalTitle');
      var bCancel = document.getElementById('btnCancel');
      var bSub = document.getElementById('btnSubmit');

      if (isMy) {
        langBtn.innerText = "English";
        ad.innerText = "[ ကြော်ငြာနေရာ - Banner Ad ]";
        mTitle.innerText = "Base အသစ်တင်ရန်";
        bCancel.innerText = "ပိတ်မည်";
        bSub.innerText = "တင်မည်";
      } else {
        langBtn.innerText = "မြန်မာစာ";
        ad.innerText = "[ Advertisement - Banner Ad ]";
        mTitle.innerText = "Share New Base";
        bCancel.innerText = "Cancel";
        bSub.innerText = "Publish";
      }
    }

    function handlePostSubmit(e) {
      e.preventDefault();
      var title = document.getElementById('postTitle').value;
      var th = document.getElementById('postTh').value;
      var cat = document.getElementById('postCat').valu
