<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ClashBase Hub - Professional COC Layouts</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0a0a0a; color: #f8fafc; padding-bottom: 90px; }
    
    /* Header */
    header { position: sticky; top: 0; z-index: 40; background-color: rgba(23, 23, 23, 0.95); border-bottom: 1px solid #262626; backdrop-filter: blur(8px); }
    .header-top { max-width: 480px; margin: 0 auto; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .logo { font-size: 18px; font-weight: 800; color: #f59e0b; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .controls { display: flex; align-items: center; gap: 6px; }
    
    .btn-lang { background: #262626; color: #f59e0b; border: 1px solid #404040; padding: 5px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
    .select-box { background: #262626; color: #f59e0b; border: 1px solid #404040; padding: 5px 6px; border-radius: 6px; font-size: 11px; font-weight: bold; outline: none; cursor: pointer; }
    
    /* Category Scroll */
    .cat-bar { max-width: 480px; margin: 0 auto; padding: 4px 12px 10px; display: flex; gap: 6px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
    .cat-bar::-webkit-scrollbar { display: none; }
    .cat-btn { background: #262626; color: #cbd5e1; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }
    .cat-btn.active { background: #f59e0b; color: #0a0a0a; }

    /* Ad Banner */
    .ad-box { max-width: 480px; margin: 10px auto 4px; padding: 0 14px; }
    .ad-inner { width: 100%; height: 48px; border: 1px dashed #334155; background: #171717; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #64748b; }

    /* Layout Cards */
    .feed { max-width: 480px; margin: 0 auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 16px; }
    .card { background: #171717; border: 1px solid #262626; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
    .img-wrap { position: relative; width: 100%; height: 210px; background: #000; }
    .img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .badge-th { position: absolute; top: 10px; left: 10px; background: #f59e0b; color: #000; font-size: 11px; font-weight: 900; padding: 3px 7px; border-radius: 6px; }
    .badge-cat { position: absolute; top: 10px; left: 62px; background: rgba(0,0,0,0.8); color: #f59e0b; border: 1px solid #404040; font-size: 10px; font-weight: bold; padding: 3px 6px; border-radius: 6px; }
    
    .card-body { padding: 12px; }
    .card-title { font-size: 14px; font-weight: bold; color: #f8fafc; margin-bottom: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #262626; padding-top: 10px; font-size: 12px; color: #94a3b8; }
    .meta-info { display: flex; gap: 12px; align-items: center; }
    .btn-copy { background: #f59e0b; color: #0a0a0a; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .btn-copy.done { background: #10b981; color: #fff; }

    /* Floating Add Button */
    .fab { position: fixed; bottom: 24px; right: 18px; width: 56px; height: 56px; background: #10b981; border: 2px solid #34d399; border-radius: 50%; color: #000; font-size: 32px; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(0,0,0,0.6); cursor: pointer; z-index: 50; }

    /* Modal */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 60; }
    .modal.show { display: flex; }
    .modal-box { background: #171717; border: 1px solid #262626; border-radius: 16px; width: 100%; max-width: 440px; padding: 18px; max-height: 90vh; overflow-y: auto; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .modal-head h2 { font-size: 16px; font-weight: bold; color: #f59e0b; }
    .modal-close { background: none; border: none; font-size: 24px; color: #94a3b8; cursor: pointer; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    .form-input { width: 100%; background: #0a0a0a; border: 1px solid #262626; border-radius: 8px; padding: 8px 10px; color: #fff; font-size: 12px; outline: none; }
    .form-row { display: flex; gap: 8px; }
    .form-row > div { flex: 1; }
    .modal-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    .btn-cancel { background: #262626; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-size: 12px; cursor: pointer; }
    .btn-submit { background: #f59e0b; color: #000; border: none; padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }
    .no-bases-hint { text-align: center; color: #94a3b8; font-size: 13px; padding: 30px 0; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-top">
      <div class="logo" id="homeLogo">🛡️ ClashBase</div>
      <div class="controls">
        <button type="button" class="btn-lang" id="langToggle">English</button>
        <select class="select-box" id="sortFilter">
          <option value="NEW">⚡ NEW</option>
          <option value="POPULAR">🔥 POPULAR</option>
        </select>
        <select class="select-box" id="thFilter">
          <option value="ALL">ALL TH</option>
          <option value="TH 18">TH 18</option>
          <option value="TH 17">TH 17</option>
          <option value="TH 16">TH 16</option>
          <option value="TH 15">TH 15</option>
          <option value="TH 14">TH 14</option>
          <option value="TH 13">TH 13</option>
          <option value="TH 12">TH 12</option>
          <option value="TH 11">TH 11</option>
          <option value="TH 10">TH 10</option>
        </select>
      </div>
    </div>

    <!-- Category Tabs -->
    <div class="cat-bar" id="catBar">
      <button type="button" class="cat-btn active" data-cat="ALL">All</button>
      <button type="button" class="cat-btn" data-cat="WAR">War</button>
      <button type="button" class="cat-btn" data-cat="CWL">CWL</button>
      <button type="button" class="cat-btn" data-cat="FARMING">Farming</button>
      <button type="button" class="cat-btn" data-cat="HYBRID">Hybrid</button>
      <button type="button" class="cat-btn" data-cat="RANK">Rank</button>
      <button type="button" class="cat-btn" data-cat="FUNNY">Funny</button>
    </div>
  </header>

  <!-- Banner Ad Slot -->
  <div class="ad-box">
    <div class="ad-inner" id="adPlaceholder">[ ကြော်ငြာနေရာ - Banner Ad ]</div>
  </div>

  <!-- Feed Container -->
  <main class="feed" id="feedContainer"></main>

  <!-- Floating Add Button -->
  <button type="button" class="fab" id="openAddModal">+</button>

  <!-- Upload Modal -->
  <div class="modal" id="modalWindow">
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="modalTitle">Base အသစ်တင်ရန်</h2>
        <button type="button" class="modal-close" id="closeAddModal">&times;</button>
      </div>
      <form id="newPostForm">
        <div class="form-group">
          <label id="lblTitle">ခေါင်းစဉ်</label>
          <input type="text" id="newTitle" required placeholder="ဥပမာ - Anti-2 Star CWL Base" class="form-input">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label id="lblTh">Town Hall</label>
            <select id="newTh" class="form-input">
              <option value="TH 18">TH 18</option>
              <option value="TH 17">TH 17</option>
              <option value="TH 16">TH 16</option>
              <option value="TH 15">TH 15</option>
              <option value="TH 14">TH 14</option>
              <option value="TH 13">TH 13</option>
              <option value="TH 12">TH 12</option>
              <option value="TH 11">TH 11</option>
              <option value="TH 10">TH 10</option>
            </select>
          </div>
          <div class="form-group">
            <label id="lblType">အမျိုးအစား</label>
            <select id="newCat" class="form-input">
              <option value="WAR">WAR</option>
              <option value="RANK">RANK</option>
              <option value="CWL">CWL</option>
              <option value="HYBRID">HYBRID</option>
              <option value="FARMING">FARMING</option>
              <option value="FUNNY">FUNNY</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label id="lblLink">COC Layout Link (ဂိမ်းထဲမှ Share as link)</label>
          <input type="url" id="newLink" required placeholder="https://link.clashofclans.com/en?action=OpenLayout&id=..." class="form-input">
        </div>
        <div class="form-group">
          <label id="lblImg">Base ဓာတ်ပုံ (Gallery မှ ရွေးပါ)</label>
          <input type="file" id="newFile" accept="image/*" required class="form-input" style="padding: 5px;">
        </div>
        <div class="modal-btns">
          <button type="button" class="btn-cancel" id="cancelAddModal">ပိတ်မည်</button>
          <button type="submit" class="btn-submit" id="submitAddModal">တင်မည်</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    var activeTh = 'ALL';
    var activeCat = 'ALL';
    var isBurmese = true;

    // LocalStorage မှ Base များကို အမြဲတမ်း သိမ်းဆည်းထားခြင်း
    function getStoredBases() {
      try {
        var data = localStorage.getItem('stored_coc_bases');
        if (data) return JSON.parse(data);
      } catch(e) {}
      return [
        {
          id: 1,
          title: "TH 18 Anti-3 Star Legend Base",
          th: "TH 18",
          cat: "WAR",
          copies: 160,
          link: "https://link.clashofclans.com/en",
          img: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=800&auto=format&fit=crop&q=80",
          time: "1h က"
        },
        {
          id: 2,
          title: "TH 17 Defensive CWL Hard Base",
          th: "TH 17",
          cat: "CWL",
          copies: 95,
          link: "https://link.clashofclans.com/en",
          img: "https://images.unsplash.com/photo-1511512578047-dfb367046420?w=800&auto=format&fit=crop&q=80",
          time: "3h က"
        },
        {
          id: 3,
          title: "TH 16 Trophy Push & Legend Base",
          th: "TH 16",
          cat: "RANK",
          copies: 245,
          link: "https://link.clashofclans.com/en",
          img: "https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=800&auto=format&fit=crop&q=80",
          time: "5h က"
        },
        {
          id: 4,
          title: "TH 15 Dark Elixir Farming Base",
          th: "TH 15",
          cat: "FARMING",
          copies: 70,
          link: "https://link.clashofclans.com/en",
          img: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=800&auto=format&fit=crop&q=80",
          time: "8h က"
        }
      ];
    }

    var allBases = getStoredBases();

    function renderFeed() {
      var container = document.getElementById('feedContainer');
      var sortMode = document.getElementById('sortFilter').value;

      var filtered = allBases.filter(function(b) {
        var matchTh = (activeTh === 'ALL' || b.th === activeTh);
        var matchCat = (activeCat === 'ALL' || b.cat === activeCat);
        return matchTh && matchCat;
      });

      if (sortMode === 'POPULAR') {
        filtered.sort(function(a, b) { return b.copies - a.copies; });
      }

      if (filtered.length === 0) {
        container.innerHTML = '<div class="no-bases-hint">' + (isBurmese ? 'ရွေးချယ်ထားသော Base မရှိသေးပါ။' : 'No bases found.') + '</div>';
        return;
      }

      var html = '';
      for (var i = 0; i < filtered.length; i++) {
        var b = filtered[i];
        html += '<div class="card">' +
          '<div class="img-wrap">' +
            '<img src="' + b.img + '" alt="Base">' +
            '<span class="badge-th">' + b.th + '</span>' +
            '<span class="badge-cat">' + b.cat + '</span>' +
          '</div>' +
          '<div class="card-body">' +
            '<div class="card-title">' + b.title + '</div>' +
            '<div class="card-footer">' +
              '<div class="meta-info">' +
                '<span>📋 <b class="copy-cnt">' + b.copies + '</b></span>' +
                '<span class="time-txt">' + b.time + '</span>' +
              '</div>' +
              '<button type="button" class="btn-copy" onclick="handleCopyClick(' + b.id + ', \'' + encodeURIComponent(b.link) + '\', this)">📥 <span class="copy-txt">Copy Layout</span></button>' +
            '</div>' +
          '</div>' +
        '</div>';
      }
      container.innerHTML = html;
    }

    // Category Tabs
    var catButtons = document.querySelectorAll('.cat-btn');
    for (var i = 0; i < catButtons.length; i++) {
      catButtons[i].onclick = function() {
        activeCat = this.getAttribute('data-cat');
        for (var j = 0; j < catButtons.length; j++) catButtons[j].classList.remove('active');
        this.classList.add('active');
        renderFeed();
      };
    }

    // TH Select
    document.getElementById('thFilter').onchange = function() {
      activeTh = this.value;
      renderFeed();
    };

    // Sort Select
    document.getElementById('sortFilter').onchange = function() {
      renderFeed();
    };

    // Home Reset
    document.getElementById('homeLogo').onclick = function() {
      activeTh = 'ALL';
      activeCat = 'ALL';
      document.getElementById('thFilter').value = 'ALL';
      document.getElementById('sortFilter').value = 'NEW';
      for (var i = 0; i < catButtons.length; i++) catButtons[i].classList.remove('active');
      catButtons[0].classList.add('active');
      renderFeed();
    };

    // Language Toggle
    document.getElementById('langToggle').onclick = function() {
      isBurmese = !isBurmese;
      this.innerText = isBurmese ? "English" : "မြန်မာစာ";
      document.getElementById('adPlaceholder').innerText = isBurmese ? "[ ကြော်ငြာနေရာ - Banner Ad ]" : "[ Advertisement - Banner Ad ]";
      document.getElementById('modalTitle').innerText = isBurmese ? "Base အသစ်တင်ရန်" : "Share New Base";
      document.getElementById('lblTitle').innerText = isBurmese ? "ခေါင်းစဉ်" : "Base Title";
      document.getElementById('lblTh').innerText = isBurmese ? "Town Hall" : "Town Hall";
      document.getElementById('lblType').innerText = isBurmese ? "အမျိုးအစား" : "Category";
      document.getElementById('lblLink').innerText = isBurmese ? "COC Layout Link (ဂိမ်းထဲမှ Share as link)" : "COC Layout Link";
      document.getElementById('lblImg').innerText = isBurmese ? "Base ဓာတ်ပုံ (Gallery မှ ရွေးပါ)" : "Base Screenshot";
      document.getElementById('cancelAddModal').innerText = isBurmese ? "ပိတ်မည်" : "Cancel";
      document.getElementById('submitAddModal').innerText = isBurmese ? "တင်မည်" : "Publish";
      renderFeed();
    };

    // Copy Layout နှိပ်သည့်အခါ
    window.handleCopyClick = function(id, encodedLink, btn) {
      var link = decodeURIComponent(encodedLink);
      
      // Update Copy Count in Memory & Storage
      for (var i = 0; i < allBases.length; i++) {
        if (allBases[i].id === id) {
          allBases[i].copies += 1;
          break;
        }
      }
      localStorage.setItem('stored_coc_bases', JSON.stringify(allBases));

      var txtSpan = btn.querySelector('.copy-txt');
      txtSpan.innerText = "Copied!";
      btn.classList.add('done');

      if (navigator.clipboard) {
        navigator.clipboard.writeText(link).catch(function() {});
      }

      setTimeout(function() {
        btn.classList.remove('done');
        txtSpan.innerText = "Copy Layout";
        // ဂိမ်းဆီသို့ တိုက်ရိုက် ခုန်ကူးဖွင့်ခြင်း
        if (link) {
          window.location.href = link;
        }
      }, 400);
    };

    // Modal
    var modal = document.getElementById('modalWindow');
    document.getElementById('openAddModal').onclick = function() { modal.classList.add('show'); };
    function closeModal() { modal.classList.remove('show'); }
    document.getElementById('closeAddModal').onclick = closeModal;
    document.getElementById('cancelAddModal').onclick = closeModal;

    // Base အသစ်တင်ပြီး LocalStorage ထဲ အပြီးတိုင်သိမ်းဆည်းခြင်း (Refresh လုပ်လည်း မပျောက်ပါ)
    document.getElementById('newPostForm').onsubmit = function(e) {
      e.preventDefault();
      var title = document.getElementById('newTitle').value;
      var th = document.getElementById('newTh').value;
      var cat = document.getElementById('newCat').value;
      var link = document.getElementById('newLink').value;
      var file = document.getElementById('newFile').files[0];

      if (!file) return;

      var reader = new FileReader();
      reader.onload = function(evt) {
        var newBaseItem = {
          id: Date.now(),
          title: title,
          th: th,
          cat: cat,
          copies: 0,
          link: link,
          img: evt.target.result,
          time: isBurmese ? "ခုနက" : "Just now"
        };

        allBases.unshift(newBaseItem);
        // Refresh လုပ်တိုင်း မပျောက်စေရန် LocalStorage တွင် သိမ်းသည်
        localStorage.setItem('stored_coc_bases', JSON.stringify(allBases));

        alert(isBurmese ? "Base တင်ခြင်း အောင်မြင်ပါသည်! (Refresh လုပ်လည်း မပျောက်တော့ပါ)" : "Base saved successfully!");
        document.getElementById('newPostForm').reset();
        closeModal();
        renderFeed();
      };
      reader.readAsDataURL(file);
    };

    // Start Initial Render
    renderFeed();
  </script>
</body>
</html>
